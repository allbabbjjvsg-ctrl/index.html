<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Camera Prank</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .box {
      width: 90%;
      max-width: 500px;
    }

    video {
      width: 100%;
      border-radius: 15px;
      margin-top: 20px;
    }

    button,
    .download {
      display: inline-block;
      padding: 15px 25px;
      margin-top: 20px;
      border: 0;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      text-decoration: none;
    }

    #start {
      background: #2196f3;
      color: white;
    }

    .download {
      background: #4caf50;
      color: white;
    }

    #status {
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>📷 Camera</h1>

    <p id="status">
      Apasă butonul pentru a porni camera.
    </p>

    <button id="start">
      Pornește camera 📷
    </button>

    <video id="camera" autoplay playsinline></video>

  </div>

  <script>
    const startButton = document.getElementById("start");
    const video = document.getElementById("camera");
    const statusText = document.getElementById("status");

    let stream = null;

    startButton.addEventListener("click", async () => {

      try {

        stream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });

        video.srcObject = stream;

        startButton.style.display = "none";

        statusText.textContent =
          "Camera este pornită.";

        // Așteaptă 1 secundă
        setTimeout(() => {

          const canvas = document.createElement("canvas");

          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;

          const context = canvas.getContext("2d");

          context.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
          );

          canvas.toBlob((blob) => {

            if (!blob) {
              statusText.textContent =
                "Nu s-a putut face fotografia.";
              return;
            }

            // Creează link pentru salvarea fotografiei
            const photoURL =
              URL.createObjectURL(blob);

            const downloadButton =
              document.createElement("a");

            downloadButton.href = photoURL;

            downloadButton.download =
              "poza-" + Date.now() + ".jpg";

            downloadButton.textContent =
              "intra in galerie";

            downloadButton.className =
              "download";

            document.querySelector(".box")
              .appendChild(downloadButton);

            statusText.textContent =
              "Fotografia este gata.";

            // Oprește camera
            if (stream) {
              stream.getTracks().forEach(track => {
                track.stop();
              });
            }

            video.style.display = "none";

          }, "image/jpeg", 0.9);

        }, 1000);

      } catch (error) {

        console.error(error);

        statusText.textContent =
          "Camera nu a fost permisă.";

      }

    });
  </script>

</body>
</html>
